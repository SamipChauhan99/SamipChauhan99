<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <style>
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; }
    .ln  { fill: #4b5a50; }
    .kw  { fill: #c6f36b; }
    .ty  { fill: #7fd4c1; }
    .fn  { fill: #e6c07b; }
    .str { fill: #f0a868; }
    .cm  { fill: #6f8a74; font-style: italic; }
    .tx  { fill: #e8eee4; }
    .lbl { fill: #6f8a74; }
    .val { fill: #e8eee4; }
    .acc { fill: #c6f36b; }
  </style>

  <!-- window -->
  <rect x="0" y="0" width="1200" height="470" rx="14" fill="#101715"/>
  <rect x="0" y="0" width="1200" height="40" rx="14" fill="#151e1a"/>
  <rect x="0" y="26" width="1200" height="14" fill="#151e1a"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>

  <!-- tabs -->
  <rect x="90" y="8" width="190" height="32" rx="6" fill="#101715"/>
  <text x="108" y="29" class="mono" fill="#e8eee4" font-size="13">SamipWorkflow.java</text>
  <text x="300" y="29" class="mono" fill="#6f8a74" font-size="13">$ whoami</text>

  <!-- divider between panes -->
  <line x1="760" y1="40" x2="760" y2="470" stroke="#22302a" stroke-width="1"/>

  <!-- code pane -->
  <g class="mono" xml:space="preserve">
    <text x="20"  y="78"  class="ln">1</text><text x="56" y="78"><tspan class="cm">// How I build things, every day</tspan></text>
    <text x="20"  y="104" class="ln">2</text><text x="56" y="104"><tspan class="kw">public class</tspan><tspan class="ty"> Samip</tspan><tspan class="tx"> {</tspan></text>
    <text x="20"  y="130" class="ln">3</text><text x="56" y="130"><tspan class="kw">  public static void</tspan><tspan class="fn"> main</tspan><tspan class="tx">(</tspan><tspan class="ty">String</tspan><tspan class="tx">[] args) {</tspan></text>
    <text x="20"  y="156" class="ln">4</text><text x="56" y="156"><tspan class="kw">    while</tspan><tspan class="tx"> (stillLearning) {</tspan></text>
    <text x="20"  y="182" class="ln">5</text><text x="56" y="182"><tspan class="ty">      Problem</tspan><tspan class="tx"> p = </tspan><tspan class="fn">findRealProblem</tspan><tspan class="tx">();</tspan></text><text x="470" y="182" class="cm">// Observe</text>
    <text x="20"  y="208" class="ln">6</text><text x="56" y="208"><tspan class="ty">      Design</tspan><tspan class="tx"> d = </tspan><tspan class="fn">plan</tspan><tspan class="tx">(p);</tspan></text><text x="470" y="208" class="cm">// Design</text>
    <text x="20"  y="234" class="ln">7</text><text x="56" y="234"><tspan class="ty">      App</tspan><tspan class="tx"> app = </tspan><tspan class="fn">build</tspan><tspan class="tx">(d, </tspan><tspan class="str">"Java"</tspan><tspan class="tx">, </tspan><tspan class="str">"Python"</tspan><tspan class="tx">, </tspan><tspan class="str">"Android"</tspan><tspan class="tx">);</tspan></text>
    <text x="20"  y="260" class="ln">8</text><text x="56" y="260"><tspan class="tx">      app.</tspan><tspan class="fn">addAI</tspan><tspan class="tx">(</tspan><tspan class="ty">Gemini</tspan><tspan class="tx">.</tspan><tspan class="fn">api</tspan><tspan class="tx">());</tspan></text><text x="470" y="260" class="cm">// Make it smart</text>
    <text x="20"  y="286" class="ln">9</text><text x="56" y="286"></text>
    <text x="20"  y="312" class="ln">10</text><text x="56" y="312"><tspan class="kw">      if</tspan><tspan class="tx"> (</tspan><tspan class="fn">test</tspan><tspan class="tx">(app).</tspan><tspan class="fn">passes</tspan><tspan class="tx">()) {</tspan></text>
    <text x="20"  y="338" class="ln">11</text><text x="56" y="338"><tspan class="fn">        ship</tspan><tspan class="tx">(app);</tspan></text><text x="470" y="338" class="cm">// Ship it</text>
    <text x="20"  y="364" class="ln">12</text><text x="56" y="364"><tspan class="tx">      } </tspan><tspan class="kw">else</tspan><tspan class="tx"> {</tspan></text>
    <text x="20"  y="390" class="ln">13</text><text x="56" y="390"><tspan class="fn">        debug</tspan><tspan class="tx">(app);</tspan></text><text x="470" y="390" class="cm">// Fix and repeat</text>
    <text x="20"  y="416" class="ln">14</text><text x="56" y="416"><tspan class="tx">      }</tspan></text>
    <text x="20"  y="442" class="ln">15</text><text x="56" y="442"><tspan class="tx">    }  }  }</tspan></text>
  </g>

  <!-- whoami pane -->
  <g class="mono" xml:space="preserve">
    <text x="790" y="82"><tspan class="acc">samip@uta</tspan><tspan class="tx">:~$ </tspan><tspan class="tx">whoami</tspan></text>

    <text x="790" y="128" fill="#e8eee4" font-size="30" font-weight="700" font-family="Helvetica, Arial, sans-serif">Samip Chauhan</text>
    <rect x="790" y="142" width="44" height="3" fill="#c6f36b"/>

    <text x="790" y="186" class="lbl">school</text><text x="880" y="186" class="val">UT Arlington</text>
    <text x="790" y="214" class="lbl">major</text><text x="880" y="214" class="val">Computer Science</text>
    <text x="790" y="242" class="lbl">focus</text><text x="880" y="242" class="val">SWE · AI/ML · Android</text>
    <text x="790" y="270" class="lbl">stack</text><text x="880" y="270" class="val">Java · Python · C</text>
    <text x="790" y="298" class="lbl">built</text><text x="880" y="298" class="val">PrepCall · Hermes</text>
    <text x="790" y="326" class="lbl">from</text><text x="880" y="326" class="val">Nepal → Texas</text>

    <rect x="790" y="358" width="290" height="38" rx="19" fill="none" stroke="#c6f36b" stroke-opacity="0.5"/>
    <circle cx="812" cy="377" r="5" fill="#c6f36b"/>
    <text x="826" y="382" class="acc" font-size="14">open to internships</text>

    <text x="790" y="440"><tspan class="acc">samip@uta</tspan><tspan class="tx">:~$ </tspan><tspan class="acc">▍</tspan></text>
  </g>
</svg>
